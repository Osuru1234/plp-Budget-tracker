
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Take control of your money</p>
    </header>

    <main class="container">

        <section class="budget-section">
            <h2>Monthly Budget</h2>
            <input type="number" id="budgetInput" placeholder="Enter your budget">
            <button onclick="setBudget()">Set Budget</button>
        </section>

        <section class="summary">
            <div class="card">
                <h3>Total Budget</h3>
                <p id="totalBudget">KSh 0</p>
            </div>

            <div class="card">
                <h3>Total Income</h3>
                <p id="totalIncome">KSh 0</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">KSh 0</p>
            </div>

            <div class="card">
                <h3>Remaining Balance</h3>
                <p id="balance">KSh 0</p>
            </div>
        </section>

        <section class="transaction-section">
            <h2>Add Transaction</h2>

            <form id="transactionForm">
                <input type="text" id="description"
                    placeholder="Transaction description" required>

                <input type="number" id="amount"
                    placeholder="Amount (KSh)" min="0.01" step="0.01" required>

                <select id="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <select id="category" required>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Education">Education</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Savings">Savings</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <section class="history-section">
            <h2>Transaction History</h2>

            <table>
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="transactionList"></tbody>
            </table>
        </section>

    </main>

    <footer>
        <p>© 2026 SpendWise. Manage your money wisely.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
